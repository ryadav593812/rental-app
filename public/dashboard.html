<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Namma Party Props - My Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-sm border">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">My Event Bookings</h1>
        <p id="user-label" class="text-xs text-indigo-600 font-mono mt-0.5"></p>
      </div>
      <div class="flex gap-2">
        <a href="index.html" class="text-sm bg-indigo-600 text-white px-4 py-2 rounded font-bold hover:bg-indigo-700 shadow">Browse Props</a>
        <button onclick="handleLogout()" class="text-sm bg-slate-100 text-slate-700 px-3 py-2 rounded hover:bg-slate-200">Sign Out</button>
      </div>
    </div>

    <div id="orders-container" class="space-y-4">
      <p class="text-center p-4 text-gray-400 italic text-sm">Loading your orders...</p>
    </div>
  </div>

  <script>
    const token = sessionStorage.getItem('activeUser');
    if (!token) { alert("Session expired."); window.location.href = 'index.html'; }

    const user = JSON.parse(token);
    const phone = user.phone;
    document.getElementById('user-label').innerText = `${user.name || 'User'} · ${phone}`;

    function handleLogout() {
      sessionStorage.removeItem('activeUser');
      window.location.href = 'index.html';
    }

    const STATUS_COLORS = {
      'PENDING': 'bg-amber-100 text-amber-800 border-amber-200',
      'REVIEWED': 'bg-blue-100 text-blue-800 border-blue-200',
      'ORDERED': 'bg-emerald-100 text-emerald-800 border-emerald-200',
      'DELIVERED': 'bg-purple-100 text-purple-800 border-purple-200',
      'READY TO PICK UP': 'bg-pink-100 text-pink-800 border-pink-200',
      'COMPLETED': 'bg-slate-100 text-slate-700 border-slate-200',
      'CANCELLED': 'bg-rose-100 text-rose-700 border-rose-200'
    };

    async function fetchOrders() {
      const container = document.getElementById('orders-container');
      try {
        // Use the dedicated customer endpoint — server filters by phone
        const res = await fetch(`/api/orders/customer/${phone}`);
        if (!res.ok) throw new Error('Failed to fetch orders');
        const orders = await res.json();

        if (orders.length === 0) {
          container.innerHTML = `<div class="text-center p-8 bg-white border rounded shadow-sm text-gray-500">You have no orders yet. <a href="index.html" class="text-indigo-600 underline">Browse props →</a></div>`;
          return;
        }

        container.innerHTML = orders.map(order => {
          const items = Array.isArray(order.items_json) ? order.items_json : [];
          const statusClass = STATUS_COLORS[order.status] || 'bg-gray-100 text-gray-700 border-gray-200';

          const itemRows = items.map(i => `
            <li class="flex justify-between py-1 border-b border-gray-100 last:border-none text-xs">
              <span class="text-gray-700 font-medium">• ${i.name}</span>
              <span class="text-gray-400 font-mono">₹${i.price}</span>
            </li>`).join('');

          let actionBlock = '';
          if (order.status === 'REVIEWED') {
            actionBlock += `
              <div class="mt-4 bg-indigo-50 border border-indigo-200 p-3 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <p class="text-xs text-indigo-900 font-medium">✓ Your order has been reviewed. Pay advance to confirm.</p>
                <button onclick="payAdvance(${order.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded shadow">Pay Advance</button>
              </div>`;
          }
          if (['PENDING', 'REVIEWED', 'ORDERED'].includes(order.status)) {
            actionBlock += `
              <div class="mt-3 flex justify-end">
                <button onclick="cancelOrder(${order.id})" class="text-xs text-rose-600 hover:underline font-bold">🗑️ Cancel Order</button>
              </div>`;
          }

          const noteBlock = order.admin_notes ? `
            <div class="mt-3 bg-amber-50 border border-amber-200 p-3 rounded text-xs text-amber-800">
              <span class="font-bold block mb-0.5">ℹ️ Admin Note:</span>
              <p class="italic">${order.admin_notes}</p>
            </div>` : '';

          return `
            <div class="bg-white p-5 border rounded-lg shadow-sm space-y-3 hover:shadow-md transition">
              <div class="flex justify-between items-center border-b pb-2">
                <div class="flex gap-2 items-center">
                  <span class="font-mono text-xs font-bold text-gray-400 bg-gray-100 px-2 py-0.5 rounded">ID #${order.id}</span>
                  <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded border border-indigo-100">🗓️ ${order.event_date}</span>
                </div>
                <span class="text-xs font-black uppercase tracking-wider px-2.5 py-0.5 rounded border ${statusClass}">${order.status}</span>
              </div>

              <div class="text-xs bg-gray-50 p-3 rounded border">
                <span class="font-bold text-gray-400 uppercase tracking-wider text-[10px] block mb-1.5">Items</span>
                <ul class="space-y-0.5 pl-1">${itemRows || '<li class="text-gray-400 italic">No items</li>'}</ul>
              </div>

              ${noteBlock}

              <div class="pt-2 border-t flex justify-between items-center">
                <span class="text-xs text-gray-500 uppercase font-bold text-[10px]">Total</span>
                <span class="text-lg font-black text-indigo-600">₹${order.total_price}</span>
              </div>

              ${actionBlock}
            </div>`;
        }).join('');
      } catch(err) {
        container.innerHTML = `<div class="p-4 text-center text-red-500 text-sm">Error loading orders: ${err.message}</div>`;
      }
    }

    async function payAdvance(orderId) {
      if (!confirm("Confirm advance payment simulation?")) return;
      const res = await fetch('/api/orders/update-state', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status: 'ORDERED', items: [], admin_notes: 'Advance payment confirmed.', total_price: 0 })
      });
      if (res.ok) { alert("Payment confirmed! Order locked."); fetchOrders(); }
      else { const d = await res.json(); alert(d.message); }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Cancel this order? This cannot be undone.")) return;
      const res = await fetch('/api/orders/update-state', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status: 'CANCELLED', items: [], admin_notes: 'Cancelled by customer.', total_price: 0 })
      });
      if (res.ok) { alert("Order cancelled."); fetchOrders(); }
      else { const d = await res.json(); alert(d.message); }
    }

    fetchOrders();
  </script>
</body>
</html>
